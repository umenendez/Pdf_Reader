<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biblioteca Drive</title>
<meta name="theme-color" content="#11151b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#11151b;--pn:#1a212a;--ln:#2a3340;--tx:#e9edf2;--mu:#8b97a6;--ac:#7aa2ff;--on:#0b1020;--r:6px}
html[data-t=black]{--bg:#000;--pn:#0d0f12;--ln:#23282f}
html[data-t=light]{--bg:#f3f4f6;--pn:#fff;--ln:#d8dce2;--tx:#1b2028;--mu:#5f6b7a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Bricolage Grotesque",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--ln)}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-right:auto}
#q{width:min(260px,45vw);background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:7px 10px}
.ib{width:36px;height:36px;border-radius:var(--r);background:var(--pn);border:1px solid var(--ln);font-size:17px}
#ss{position:absolute;bottom:-18px;right:16px;font-size:11px;color:var(--mu)}
#filters{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--ln);border-radius:99px;padding:5px 12px;color:var(--mu);font-size:13px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
.sep{width:1px;height:18px;background:var(--ln);flex:none}
select{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:5px 8px;font-size:13px}
main{padding:12px 16px 40px}
h3{font-size:13px;color:var(--mu);font-weight:600;margin:14px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,130px),1fr));gap:18px 14px}
.row2{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}.row2 .card{width:120px;flex:none}
.card{text-align:left;display:block}
.cv{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:hsl(var(--h) 30% 24%);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.cv span{position:absolute;inset:0;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:800;font-size:15px;line-height:1.1}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fv{position:absolute;top:6px;left:6px;font-style:normal;color:#ff7a90;text-shadow:0 1px 3px #000}
.cnt{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);border-radius:99px;font-size:11px;padding:1px 8px}
.nm{margin-top:6px;font-size:13px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:12px;color:var(--mu)}
.pg{height:3px;background:var(--ln);margin-top:5px}.pg i{display:block;height:100%;background:var(--ac)}
.empty{max-width:440px;margin:60px auto;color:var(--mu)}.empty h2{color:var(--tx);margin-bottom:8px}
.btn{background:var(--ac);color:var(--on);font-weight:700;border-radius:var(--r);padding:9px 16px;margin-top:14px}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(5,7,10,.7);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--pn);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px;position:relative}
.sh .x{position:absolute;top:8px;right:12px;font-size:26px;color:var(--mu)}
.top{display:flex;gap:16px;margin-bottom:14px}.top .cv{width:120px;flex:none}.top h2{font-size:20px;letter-spacing:-.02em;margin-bottom:10px;padding-right:24px}
.rw{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
ul{list-style:none;padding:0}
li{display:grid;grid-template-columns:1fr auto auto;gap:4px 8px;align-items:center;padding:10px 0;border-top:1px solid var(--ln);cursor:pointer}
li small{color:var(--mu)}li .pg{grid-column:1/-1;margin:0}
li button{color:var(--mu);font-size:12px;border:1px solid var(--ln);border-radius:var(--r);padding:3px 8px}
li button.on{color:var(--ac);border-color:var(--ac)}
dialog{margin:auto;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:20px;width:min(460px,92vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(5,7,10,.7)}
dialog label{display:block;margin-top:12px;font-size:13px;color:var(--mu)}
dialog input{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:var(--r);padding:8px;margin-top:4px}
dialog p{font-size:12.5px;color:var(--mu);margin-top:10px}
dialog h4{margin:20px 0 2px;font-size:14px;border-bottom:1px solid var(--ln);padding-bottom:4px}
.rr{display:flex;gap:6px;margin-top:6px}.rr input{flex:1;margin:0;min-width:0}.rr select{flex:none;max-width:120px}
.tg{display:flex!important;justify-content:space-between;align-items:center;gap:10px;color:var(--tx)!important;font-size:14px!important}
.tg input{width:auto;margin:0}.tg input[type=color]{width:44px;height:30px;padding:0}.tg select{max-width:55%}
.acts{display:flex;gap:8px;align-items:center;margin-top:18px}.acts .btn{margin:0}
#reader{position:fixed;inset:0;z-index:30;background:var(--sb,#0b0d10);display:flex}
#reader[hidden],#sheet[hidden]{display:none}
#stage{flex:1;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#pageBox{display:flex;margin:auto 0;transform-origin:0 0;will-change:transform}#pageBox canvas{display:block;flex:none;-webkit-user-drag:none}#pageBox.an{transition:transform .22s}
#reader.sc #stage{overflow:auto;display:block;touch-action:pan-x pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#reader.sc #pageBox{flex-direction:column;margin:0 auto;width:max-content;transform:none!important}
.sp{flex:none;background:rgba(128,128,128,.08);overflow:hidden}.sp canvas{display:block;width:100%;height:100%}
.inf{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px;z-index:1}
.bar{position:fixed;left:0;right:0;z-index:2;color:#e9edf2;--ln:#2a3340;background:rgba(17,21,27,.94);display:flex;align-items:center;gap:10px;padding:8px 14px;transition:transform .2s}
.bar.top{top:0;padding-top:calc(8px + env(safe-area-inset-top))}.bar.bot{bottom:0;flex-direction:column;align-items:stretch;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.bar.top.h{transform:translateY(-110%)}.bar.bot.h{transform:translateY(110%)}
.bar button{padding:5px 10px;border:1px solid var(--ln);border-radius:var(--r);font-size:13px}
#rt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#sl{width:100%;accent-color:var(--ac)}
@media(prefers-reduced-motion:reduce){.bar{transition:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
<header>
  <h1>Biblioteca</h1>
  <input id="q" type="search" placeholder="Buscar saga" aria-label="Buscar saga">
  <button class="ib" id="sy" title="Sincronizar con Drive" aria-label="Sincronizar con Drive">⟳</button>
  <button class="ib" id="st" title="Ajustes" aria-label="Ajustes">⚙</button>
  <span id="ss"></span>
</header>
<nav id="filters"></nav>
<main id="main"></main>
<div id="sheet" hidden></div>
<input type="file" id="cvIn" accept="image/*" hidden>
<div id="reader" hidden>
  <div id="stage"><div id="pageBox"></div></div>
  <div class="bar top" id="tb"><button data-r="close" aria-label="Cerrar">←</button><button data-r="list" aria-label="Volúmenes">☰</button><span id="rt"></span><button data-r="nextvol" id="nx" hidden>Siguiente vol.</button></div>
  <div class="bar bot" id="bb"><input type="range" id="sl" min="1" value="1" aria-label="Página">
    <div class="tools"><button data-r="mode"></button><button data-r="dir"></button><button data-r="fit"></button><button data-r="theme"></button><button data-r="fs" aria-label="Pantalla completa">⛶</button></div></div>
</div>
<dialog id="cfgd">
  <h2>Ajustes</h2>
  <h4>Conexión</h4>
  <label>ID de cliente de Google (OAuth)<input id="cid" placeholder="123-abc.apps.googleusercontent.com"></label>
  <h4>Rutas de Drive</h4>
  <div id="roots"></div>
  <button class="chip" id="addRoot" type="button" style="margin-top:8px">+ Añadir ruta</button>
  <p>Cada ruta es una carpeta de Drive (enlace o ID). Sus subcarpetas son sagas y sus PDFs, volúmenes. La categoría de la ruta se aplica a todas sus obras y puedes cambiarla obra a obra.</p>
  <h4>Lectura</h4>
  <label class="tg">Páginas<select id="s_mode"><option value="auto">Auto</option><option value="single">1 página</option><option value="double">2 páginas</option><option value="scroll">Scroll vertical</option></select></label>
  <label class="tg">Ajuste<select id="s_fit"><option value="page">Página entera</option><option value="width">Ancho</option></select></label>
  <label class="tg">Fondo del lector<select id="s_theme"><option value="0">Noche</option><option value="1">Negro</option><option value="2">Papel</option></select></label>
  <label class="tg">Manga de derecha a izquierda<input type="checkbox" id="s_rtl"></label>
  <label class="tg">Portada sola en doble página<input type="checkbox" id="s_cov"></label>
  <label class="tg">Invertir toques laterales<input type="checkbox" id="s_tap"></label>
  <label class="tg">Mantener pantalla encendida<input type="checkbox" id="s_wake"></label>
  <label class="tg">Marcar leído al llegar a la última página<input type="checkbox" id="s_auto"></label>
  <label class="tg">Al marcar un volumen, marcar también los anteriores<input type="checkbox" id="s_casc"></label>
  <h4>Apariencia</h4>
  <label class="tg">Tema<select id="s_app"><option value="dark">Oscuro</option><option value="black">Negro</option><option value="light">Claro</option></select></label>
  <label class="tg">Color de acento<input type="color" id="s_ac"></label>
  <label class="tg">Tamaño de portadas<select id="s_cw"><option value="100">Pequeñas</option><option value="130">Medianas</option><option value="170">Grandes</option></select></label>
  <label class="tg">Orden por defecto<select id="s_sort"><option value="recent">Recientes</option><option value="name">A–Z</option></select></label>
  <label class="tg">Mostrar «Continuar leyendo»<input type="checkbox" id="s_cont"></label>
  <div class="acts"><button class="btn" id="save" type="button">Guardar</button><button class="chip" id="cx" type="button">Cancelar</button></div>
</dialog>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const TYPES=['Manga','Manhwa','Novela','Otro'],THEMES=[['Noche','#0b0d10'],['Negro','#000'],['Papel','#d9d3c3']];
const DEF={clientId:'',roots:[],theme:0,mode:'auto',fit:'page',rtlManga:true,cover:true,tap:false,wake:true,auto:true,casc:true,app:'dark',ac:'#7aa2ff',cw:130,cont:true,sort:'recent',zw:1};
let cfg={...DEF,...(LS('cfg')||{})};if(cfg.root&&!cfg.roots.length)cfg.roots=[{id:cfg.root,type:''}];delete cfg.root;
let db=LS('db')||{sagas:{},vols:{}},lib=LS('lib')||[],token=null,tokExp=0,pfid=LS('pfid'),off=new Set(),F={q:'',type:'',st:'',fav:false,sort:cfg.sort},R=null,cur=null,timer;
const sm=id=>db.sagas[id]||{},vs=id=>db.vols[id]||{},typeOf=s=>sm(s.id).type||s.rt||'';
function markDone(s,vid,on){const i=s.vols.findIndex(v=>v.id==vid),r=cfg.casc?(on?s.vols.slice(0,i+1):s.vols.slice(i)):[s.vols[i]];
  r.forEach(v=>{const x=vs(v.id);db.vols[v.id]={...x,p:on?(x.p||1):1,n:x.n||0,done:on,t:Date.now()}});persist()}
function look(){const h=document.documentElement,n=parseInt(cfg.ac.slice(1),16);h.dataset.t=cfg.app;h.style.setProperty('--ac',cfg.ac);h.style.setProperty('--cw',cfg.cw+'px');
  h.style.setProperty('--on',.299*(n>>16)+.587*(n>>8&255)+.114*(n&255)>150?'#0b1020':'#fff');
  document.querySelector('meta[name=theme-color]').content={dark:'#11151b',black:'#000',light:'#f3f4f6'}[cfg.app]}
const status=t=>{$('#ss').textContent=t;if(t)setTimeout(()=>{if($('#ss').textContent==t)$('#ss').textContent=''},3500)};

/* ---------- almacenamiento offline (IndexedDB) ---------- */
const idb=new Promise(r=>{const q=indexedDB.open('lector',1);q.onupgradeneeded=()=>q.result.createObjectStore('pdf');q.onsuccess=()=>r(q.result)});
const tx=async(m,f)=>{const d=await idb;return new Promise((ok,ko)=>{const q=f(d.transaction('pdf',m).objectStore('pdf'));q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)})};
tx('readonly',o=>o.getAllKeys()).then(k=>{off=new Set(k)});

/* ---------- Google Drive ---------- */
function auth(){return new Promise((ok,ko)=>{
  if(token&&Date.now()<tokExp-60000)return ok(token);
  if(!cfg.clientId)return ko(new Error('Falta el ID de cliente'));
  if(typeof google==='undefined')return ko(new Error('Sin conexión'));
  google.accounts.oauth2.initTokenClient({client_id:cfg.clientId,scope:'https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.appdata',
    callback:r=>{if(r.error)return ko(new Error(r.error));token=r.access_token;tokExp=Date.now()+r.expires_in*1000;localStorage.setItem('hint','1');ok(token)}
  }).requestAccessToken({prompt:localStorage.getItem('hint')?'':'consent'})})}
async function g(u,o={},retry=1){const t=await auth();
  const r=await fetch(u.startsWith('http')?u:'https://www.googleapis.com/drive/v3/'+u,{...o,headers:{...o.headers,Authorization:'Bearer '+t}});
  if(r.status==401&&retry){token=null;return g(u,o,0)}if(!r.ok)throw new Error('Drive '+r.status);return r}
async function list(q,extra=''){let out=[],pt='';do{const r=await(await g('files?pageSize=1000&fields=nextPageToken,files(id,name,mimeType,thumbnailLink)&q='+encodeURIComponent(q)+extra+(pt?'&pageToken='+pt:''))).json();out.push(...r.files);pt=r.nextPageToken}while(pt);return out}
const nat=(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}),clean=n=>n.replace(/\.pdf$/i,'');
async function sync(){try{status('Sincronizando…');const res=[],seen=new Set(),add=x=>{if(!seen.has(x.id)){seen.add(x.id);res.push(x)}};
  for(const r of cfg.roots){const it=await list(`'${r.id}' in parents and trashed=false`);
    await Promise.all(it.filter(i=>i.mimeType=='application/vnd.google-apps.folder').map(async f=>{
      const v=(await list(`'${f.id}' in parents and trashed=false and mimeType='application/pdf'`)).sort(nat);
      if(v.length)add({id:f.id,name:f.name,rt:r.type,vols:v.map(x=>({id:x.id,name:clean(x.name),thumb:x.thumbnailLink}))})}));
    it.filter(i=>i.mimeType=='application/pdf').forEach(p=>add({id:p.id,name:clean(p.name),rt:r.type,vols:[{id:p.id,name:clean(p.name),thumb:p.thumbnailLink}]}))}
  lib=res.sort(nat);SV('lib',lib);await pull();await push();render();status('Sincronizado')}catch(e){status('Error: '+e.message)}}
const merge=a=>{for(const k in a.vols)if(!db.vols[k]||a.vols[k].t>db.vols[k].t)db.vols[k]=a.vols[k];for(const k in a.sagas)if(!db.sagas[k]||(a.sagas[k].t||0)>(db.sagas[k].t||0))db.sagas[k]=a.sagas[k]};
async function pull(){const f=(await(await g('files?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='lector.json'"))).json()).files;
  if(f[0]){pfid=f[0].id;SV('pfid',pfid);merge(await(await g('files/'+pfid+'?alt=media')).json());SV('db',db)}}
async function push(){const body=JSON.stringify(db);
  if(pfid)await g(`https://www.googleapis.com/upload/drive/v3/files/${pfid}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
  else{const r=await g('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary=bd'},
    body:`--bd\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name:'lector.json',parents:['appDataFolder']})}\r\n--bd\r\nContent-Type: application/json\r\n\r\n${body}\r\n--bd--`});
    pfid=(await r.json()).id;SV('pfid',pfid)}}
function persist(){SV('db',db);clearTimeout(timer);timer=setTimeout(()=>{if(token)push().catch(()=>{})},4000)}
const setMeta=(id,p)=>{db.sagas[id]={...sm(id),...p,t:Date.now()};persist()};

/* ---------- biblioteca ---------- */
const hue=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
function stat(s){const d=s.vols.filter(v=>vs(v.id).done).length,st=s.vols.filter(v=>vs(v.id).p>1||vs(v.id).done).length;
  const part=s.vols.reduce((a,v)=>{const x=vs(v.id);return a+(x.done?1:x.n?(x.p-1)/x.n:0)},0)/s.vols.length;
  return{d,pct:Math.round(part*100),s:d==s.vols.length?'done':st?'reading':'new'}}
const resume=s=>{const L=s.vols,i=L.findIndex(v=>v.id==sm(s.id).lv);
  if(i>=0){const x=vs(L[i].id);return x.done&&L[i+1]?L[i+1]:L[i]}
  return L.find(v=>vs(v.id).p>1&&!vs(v.id).done)||L.find(v=>!vs(v.id).done)||L[0]};
const resSub=s=>{const r=resume(s),x=vs(r.id);return x.p>1&&!x.done?`<div class="sub">${s.vols.length>1?esc(r.name)+' · ':''}pág. ${x.p}</div>`:''};
const lastT=s=>Math.max(0,...s.vols.map(v=>vs(v.id).t||0));
const src=s=>sm(s.id).cover||(s.vols[0].thumb&&s.vols[0].thumb.replace(/=s\d+$/,'=s400'));
const cover=(s,x='')=>`<div class="cv" style="--h:${hue(s.name)}"><span>${esc(s.name)}</span>${src(s)?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(src(s))}" alt="" onerror="this.remove()">`:''}${x}</div>`;
function render(){
  const ok=cfg.clientId&&cfg.roots.length;$('#filters').hidden=!lib.length;
  if(!ok||!lib.length){$('#main').innerHTML=`<div class="empty"><h2>${ok?'Biblioteca vacía':'Conecta tu Drive'}</h2>${ok?'Pulsa ⟳ para leer tu carpeta de Drive.':'Indica tu ID de cliente de Google y la carpeta donde tienes los PDFs. Cada subcarpeta será una saga.'}<br><button class="btn" id="go">${ok?'Sincronizar':'Configurar'}</button></div>`;return}
  const ch=(k,o)=>o.map(([v,l])=>`<button class="chip ${F[k]===v?'on':''}" data-f="${k}" data-v="${v}">${l}</button>`).join('');
  $('#filters').innerHTML=ch('type',[['','Todos'],...TYPES.map(t=>[t,t])])+'<span class="sep"></span>'+ch('st',[['','Todo'],['new','Sin empezar'],['reading','Leyendo'],['done','Terminados']])+
    `<span class="sep"></span><button class="chip ${F.fav?'on':''}" data-f="fav">♥ Favoritos</button><select id="so" aria-label="Ordenar"><option value="recent">Recientes</option><option value="name">A–Z</option></select>`;
  $('#so').value=F.sort;
  let l=lib.filter(s=>(!F.q||s.name.toLowerCase().includes(F.q))&&(!F.type||typeOf(s)==F.type)&&(!F.st||stat(s).s==F.st)&&(!F.fav||sm(s.id).fav));
  if(F.sort=='recent')l.sort((a,b)=>lastT(b)-lastT(a)||nat(a,b));
  let h='';
  const cont=lib.flatMap(s=>s.vols.filter(v=>{const x=vs(v.id);return x.p>1&&!x.done}).map(v=>({s,v,t:vs(v.id).t}))).sort((a,b)=>b.t-a.t).slice(0,8);
  if(cfg.cont&&cont.length&&!F.q&&!F.type&&!F.st&&!F.fav)h+=`<h3>Continuar leyendo</h3><div class="row2">${cont.map(({s,v})=>`<button class="card" data-cv="${v.id}">${cover(s)}<div class="nm">${esc(s.name)}</div><div class="sub">${esc(v.name)} · pág. ${vs(v.id).p}</div></button>`).join('')}</div>`;

  else if(k=='Escape')close();else if(k=='f')document.documentElement.requestFullscreen?.();
  else if(mode()!='scroll'&&(k=='+'||k=='-'||k=='0')){const c=[innerWidth/2,innerHeight/2];if(k=='0'){Z.s=1}else Z.s=Math.min(6,Math.max(1,Z.s*(k=='+'?1.4:1/1.4)));clampZ();applyZ()}});
